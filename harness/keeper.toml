# Keeper config for the harness stack (see docker-compose.yml). STATIC and
# committed: every value is either a compose service name or public anvil
# test material, so there is nothing for render-env.sh to render.
#
# The REAL production path, not the mock seam: the keeper obtains an actual
# MPC-TLS notarized reading of Google's live JWKS through the stack's
# notary service (whose signing key, anvil #1, is exactly the signer the
# on-chain Notary contract trusts — accounts.notary in network.local.toml),
# then submits rotate() to both JWKS contracts. Requires outbound HTTPS to
# www.googleapis.com from the keeper and notary containers.

notary_url = "tcp://notary:7047"

# anvil #5 — pure gas money for rotate(); deliberately a key with NO role
# in the stack (#0 deployer/owner, #1 notary, #2 backend, #4 demo user).
# Canonical anvil test mnemonic: public material, not a secret.
signer = "8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba"

# The network file is the source of truth for the RPC and both JWKS
# contract addresses (identity.identity_jwks_roots and
# contracts.google_oidc_verifier). Path is relative to this file — both are
# mounted under /input in the container.
[[networks]]
network_file = "network.local.toml"
