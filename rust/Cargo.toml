[workspace]
resolver = "2"
members = ["libid-oidc-core", "libid-oidc-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libid"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
