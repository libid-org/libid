[package]
name = "libid-oidc-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen wrapper for `libid-oidc-core`. Compile with `wasm-pack build --target web` for the browser Google claim flow; see rust/build-oidc-wasm.sh."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
libid-oidc-core = { path = "../libid-oidc-core" }
hex = { workspace = true }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
